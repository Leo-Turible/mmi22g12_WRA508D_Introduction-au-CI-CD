name: Symfony CI

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHP lint
        run: find src tests -name "*.php" -exec php -l {} \;

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Audit de sécurité
        run: composer audit --format=json --no-interaction
        continue-on-error: true # Permettre au CI de continuer même si des vulnérabilités sont détectées

      - name: Dump environment variables for production
        run: |
          composer dump-env prod
        env:
          APP_ENV: prod
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: symfony-artifact
          path: symfony-artifact-r1.tar.gz

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add server to known hosts
        run: |
          ssh-keyscan 45.155.170.77 >> /.ssh/known_hosts

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: symfony-artifact
          path: ./symfony-artifact

      - name: Deploy to server
        run: |
          ssh mmi22g12@45.155.170.77 << 'EOF'
          cd /var/www/my-app/
          tar -xvf ./symfony-artifact/symfony-artifact-r1.tar.gz
          rm ./symfony-artifact/symfony-artifact-r1.tar.gz
          composer install --no-dev --optimize-autoloader --ignore-platform-reqs
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console cache:clear --env=prod
          php bin/console cache:warmup --env=prod
          sudo systemctl restart apache2
          EOF
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
